[package]
name = "cmdrunner"
version = "0.7.0"
edition = "2021"

[dependencies]
eframe = "0.29"
rfd = "0.15"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = 3
lto = true
strip = true
